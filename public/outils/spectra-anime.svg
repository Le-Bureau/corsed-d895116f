<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="136" height="136" role="img" aria-label="Spectra, chargement">
  <title>Spectra, chargement</title>
  <style>
    .trace { stroke-dasharray: 1; animation: trace 1.8s ease-in-out infinite; }
    .point { transform-box: fill-box; transform-origin: center; animation: point 1.8s ease-in-out infinite; }
    @keyframes trace {
      0% { stroke-dashoffset: 1; opacity: 1; }
      45%, 85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes point {
      0%, 44% { opacity: 0; transform: scale(0); }
      52% { opacity: 1; transform: scale(1.15); }
      60%, 85% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .point { animation: none; }
    }
  </style>
  <path class="trace" pathLength="1" d="M27 6.5H12.5a5.25 5.25 0 0 0 0 10.5h9a5.25 5.25 0 0 1 0 10.5H16.5" fill="none" stroke="#0e294b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
