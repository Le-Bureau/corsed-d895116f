<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" role="img" aria-label="Axio, chargement"><title>Axio, chargement</title><style>
.roof{stroke-dasharray:1;animation:roof 1.8s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.8s ease-in-out infinite}
@keyframes roof{0%{stroke-dashoffset:1;opacity:1}45%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes dot{0%,44%{opacity:0;transform:scale(0)}52%{opacity:1;transform:scale(1.15)}60%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.roof,.dot{animation:none;stroke-dashoffset:0;opacity:1;transform:none}}
